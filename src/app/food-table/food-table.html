<smoothie-food-filter (filtered)="updateFoodTable($event)" [foods]="foods()"/>
<table class="food-table">
  <thead>
    <tr>
      <th>Ingredient</th>
      <th>Calories</th>
      <th>Amount</th>
      <th>Protein (g)</th>
      <th>Fats (g)</th>
      <th>Carbohydrates (g)</th>
    </tr>
  </thead>
  <tbody>
    @for (food of foods(); track food.id) {
      <tr>
        <td>{{ food.name }}</td>
        <td>{{ food.calories }}</td>
        <td>{{ food.amount }}</td>
        <td>{{ food.protein }}</td>
        <td>{{ food.fats }}</td>
        <td>{{ food.carbohydrates }}</td>
      </tr>
    }
    <tr class="table-totals">
      <td>{{ 'Totals:' }}</td>
      <td>{{ 1 }}</td>
      <td>{{ 2 }}</td>
      <td>{{ 3 }}</td>
      <td>{{ 4 }}</td>
      <td>{{ 5 }}</td>
    </tr>
  </tbody>
</table>
